name: Deploy node server

on:
  push:
    branches:
      - main

jobs:
  deploy-primary:
    runs-on: ubuntu-22.04

    steps:
      - name: Install SSH keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect to server, build image, and deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            # Makes the shell exit if any command returns failure (for loud errors)
            set -e

            cd ${{ secrets.WORK_DIR }}

            # Write .env file from secret
            echo "${{ secrets.ENV_FILE }}" > .env

            # Pull latest changes from Git
            git checkout main
            git pull

            # Build Docker image
            docker build -t openguessr-location-server .

            # Check if container openguessr-location-server exists
            # Run with --init so tini becomes PID 1 and reaps orphaned firefox subprocesses
            if ! docker ps -a --format '{{.Names}}' | grep -q "^openguessr-location-server$"; then
              echo "Container openguessr-location-server does not exist, creating..."
              docker run -d --init -p 3006:3006 --network host --restart unless-stopped --cpus=1 --memory=750m --name openguessr-location-server openguessr-location-server
            else
              echo "Container openguessr-location-server exists, stopping and removing..."
              docker stop openguessr-location-server || true
              docker rm openguessr-location-server || true
              docker run -d --init -p 3006:3006 --network host --restart unless-stopped --cpus=1 --memory=750m --name openguessr-location-server openguessr-location-server
            fi
          EOF

      - name: Cleanup SSH
        run: rm -rf ~/.ssh