name: Deploy Node Server

on:
  push:
    branches:
      - main

jobs:
  deploy-primary:
    runs-on: ubuntu-22.04

    steps:
      - name: Install SSH keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect to server, build image, and deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.WORK_DIR }}

            # Pull latest changes from Git
            git checkout ${{ secrets.MAIN_BRANCH }}
            git pull

            # Build Docker image
            docker build -t openguessrlocationgenerator .

            # Check if container openguessrlocationgenerator exists
            if ! docker ps -a --format '{{.Names}}' | grep -q "^openguessrlocationgenerator$"; then
              echo "Container openguessrlocationgenerator does not exist, creating..."
              docker run -d -p 3000:3000 --network host --restart unless-stopped --cpus=3 --name openguessrlocationgenerator openguessrlocationgenerator
            else
              echo "Container openguessrlocationgenerator exists, stopping and removing..."
              docker stop openguessrlocationgenerator || true
              docker rm openguessrlocationgenerator || true
              docker run -d -p 3000:3000 --network host --restart unless-stopped --cpus=3 --name openguessrlocationgenerator openguessrlocationgenerator
            fi
          EOF

      - name: Cleanup SSH
        run: rm -rf ~/.ssh